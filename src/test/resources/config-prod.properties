# NOTE: In production, sensitive values such as passwords and URLs should
# be stored as environment variables or in a secrets manager, not committed to Git.

# ── Environment ─────────────────────────────────────
ENVIRONMENT=prod

# ── Browser Configuration ──────────────────────────
BROWSER=firefox
HEADLESS=true

# ── Application URLs ───────────────────────────────
# SauceDemo and restful-booker only expose one public instance, so prod points at the
# same host as dev here. Point these at your production deployment's own URLs in a real project.
BASE_URL=https://www.saucedemo.com/
INVENTORY_PATH=inventory.html
BASE_API_URI=https://restful-booker.herokuapp.com

# ── Test Users ─────────────────────────────────────
# Test users are passed in using environment variables

# ── Test User Credentials ────────────────────────────────────
# Test user credentials are passed in using environment variables

# ── API User Credentials ────────────────────────────────────
# API user credentials are passed in using environment variables

# ── Test User Info ────────────────────────────────────
FIRST_NAME=First
LAST_NAME=Last
POSTCODE=S1111

# ── Log Level ─────────────────────────────────────
LOG_LEVEL=WARN

# ── Timeout configuration ─────────────────────────────────────
WAIT_TIMEOUT_SECONDS=10

# ── Retry configuration ────────────────────────────────────────
RETRY_COUNT=2
