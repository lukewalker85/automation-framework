name: CI
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
jobs: 
  test: 
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn verify
        env:
          HEADLESS: true